# 各リポジトリの .github/workflows/security.yml にコピーして使う（STG-repo/PRD-repo へのPRでも実行）
# Branch protection で "security" ジョブを必須にすると、合格しないとマージできない。
name: security
on: [pull_request, push, workflow_dispatch] # 手動実行では履歴全体を検査する
permissions: { contents: read, pull-requests: read } # gitleaks-actionがPRのコミット一覧を読むのに必要
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: npm audit
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high
      - name: pip-audit
        if: ${{ hashFiles('requirements.txt') != '' }}
        run: pip install pip-audit && pip-audit -r requirements.txt
